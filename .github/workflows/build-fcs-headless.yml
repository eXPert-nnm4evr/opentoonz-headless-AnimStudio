name: Furry Companion - patched OpenToonz Headless (Windows x64)

on:
  workflow_dispatch:
  push:
    paths:
      - 'OpenToonz_Headless_FCS_v0_7.diff'
      - '.github/workflows/build-fcs-headless.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      QT_PATH: ${{ github.workspace }}\thirdparty\qt\5.15.2_wintab\msvc2019_64
      BOOST_ROOT: C:\local\boost_1_87_0
      OpenCV_DIR: C:\tools\opencv\build
      OPENCV_VERSION: '4.13.0'
      BOOST_VERSION: '1.87.0'
      BOOST_TOOLSET: '14.3'
      QT_ARCHIVE_URL: https://github.com/shun-iwasawa/qt5/releases/download/v5.15.2_wintab/Qt5.15.2_wintab.zip
      THIRD_PARTY_URL: https://github.com/andeon/opentoonz-thirdparty-libs/releases/download/prebuilt-libs-v1/thirdparty-libs.zip

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Verify Windows 2022 compiler toolchain
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $vswhere = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path $vswhere)) { throw "vswhere.exe was not found on windows-2022 runner: $vswhere" }
          $vsPath = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vsPath) { throw 'Visual Studio 2022 C++ x64 toolchain not found. This workflow requires windows-2022.' }
          Write-Host "Visual Studio 2022: $vsPath"
          cmake --version
          git --version

      - name: Check and apply corrected FCS API patch
        shell: pwsh
        run: |
          $patch = Join-Path $env:GITHUB_WORKSPACE 'OpenToonz_Headless_FCS_v0_7.diff'
          if (!(Test-Path $patch)) { throw "Missing OpenToonz_Headless_FCS_v0_7.diff in repository root." }
          git apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw "Corrected patch does not match this source revision. No files were changed." }
          git apply $patch
          if ($LASTEXITCODE -ne 0) { throw "git apply failed." }
          Write-Host 'Corrected patch applied.'

          # Regression guard for the compile error in the previous patch:
          # mesh parameters must be validated only inside buildMeshAdvanced, not newLevel.
          $sceneFile = Join-Path $env:GITHUB_WORKSPACE 'toonz\sources\toonzlib\scriptbinding_scene.cpp'
          $scene = Get-Content $sceneFile -Raw
          $match = [regex]::Match($scene, '(?s)QScriptValue Scene::newLevel\b.*?(?=\nQScriptValue Scene::|\z)')
          if (!$match.Success) { throw 'Could not locate Scene::newLevel for source sanity check.' }
          if ($match.Value -match '\b(targetEdgeLength|margin|maxVertices)\b') {
            throw 'Patch regression: mesh parameter validation was found inside Scene::newLevel.'
          }
          if ($scene -notmatch 'QScriptValue Scene::buildMeshAdvanced') { throw 'buildMeshAdvanced implementation is missing.' }

          # C2491 guard: dependency headers may redefine generic DVAPI (e.g. tfx.h).
          # All Q_OBJECT wrappers must use the dedicated script-binding export macro.
          $bindingDir = Join-Path $env:GITHUB_WORKSPACE 'toonz\sources\include\toonz'
          $bindingHeader = Get-Content (Join-Path $bindingDir 'scriptbinding.h') -Raw
          if ($bindingHeader -notmatch '#define SCRIPTBINDING_API DV_EXPORT_API' -or $bindingHeader -notmatch '#define SCRIPTBINDING_API DV_IMPORT_API') {
            throw 'SCRIPTBINDING_API export/import definitions are missing.'
          }
          $badWrappers = Get-ChildItem $bindingDir -Filter 'scriptbinding*.h' | Select-String -Pattern 'class\s+DVAPI\s+'
          if ($badWrappers) { throw ('Some scriptbinding wrappers still use the unstable DVAPI macro: ' + (($badWrappers | ForEach-Object { $_.Path }) -join ', ')) }
          $toonzlibCmake = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'toonz\sources\toonzlib\CMakeLists.txt') -Raw
          if ($toonzlibCmake -notmatch 'target_compile_definitions\(toonzlib PRIVATE TOONZLIB_EXPORTS\)') {
            throw 'Explicit TOONZLIB_EXPORTS target definition is missing.'
          }
          Write-Host 'C++ source sanity checks passed, including Qt MOC export-macro guard.'
          "Corrected FCS patch applied to commit $env:GITHUB_SHA" | Out-File -FilePath "$env:GITHUB_WORKSPACE\fcs-build-source.txt" -Encoding utf8

      - name: Install OpenCV and Boost if not present
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\tools\opencv\build\x64\vc16\bin\opencv_world4130.dll')) {
            choco install opencv --version=$env:OPENCV_VERSION --no-progress --yes --force
            if ($LASTEXITCODE -ne 0) { throw 'OpenCV install failed.' }
          }
          if (!(Test-Path $env:BOOST_ROOT)) {
            choco install boost-msvc-$env:BOOST_TOOLSET --version=$env:BOOST_VERSION --no-progress --yes --force
            if ($LASTEXITCODE -ne 0) { throw 'Boost install failed.' }
          }

      - name: Download custom Qt 5.15.2 and prebuilt third-party libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'thirdparty\qt' | Out-Null
          Invoke-WebRequest -Uri $env:QT_ARCHIVE_URL -OutFile 'Qt5.15.2_wintab.zip'
          & 7z x 'Qt5.15.2_wintab.zip' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Qt archive extraction failed.' }
          Move-Item -Force 'Qt5.15.2_wintab\5.15.2_wintab' 'thirdparty\qt\5.15.2_wintab'
          Invoke-WebRequest -Uri $env:THIRD_PARTY_URL -OutFile 'thirdparty-libs.zip'
          & 7z x -y 'thirdparty-libs.zip' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Prebuilt third-party library extraction failed.' }

      - name: Prepare third-party headers
        shell: pwsh
        run: |
          Copy-Item 'thirdparty\tiff-4.0.3\libtiff\tif_config.vc.h' 'thirdparty\tiff-4.0.3\libtiff\tif_config.h' -Force
          Copy-Item 'thirdparty\tiff-4.0.3\libtiff\tiffconf.vc.h' 'thirdparty\tiff-4.0.3\libtiff\tiffconf.h' -Force
          Copy-Item 'thirdparty\libpng-1.6.21\scripts\pnglibconf.h.prebuilt' 'thirdparty\libpng-1.6.21\pnglibconf.h' -Force

      - name: Configure OpenToonz Headless
        shell: pwsh
        run: |
          $configureLog = Join-Path $env:GITHUB_WORKSPACE 'build-fcs-configure.log'
          $cmd = 'cmake -S "toonz\sources" -B "toonz\build" -G "Visual Studio 17 2022" -A x64 -DQT_PATH="' + $env:QT_PATH + '" -DBOOST_ROOT="' + $env:BOOST_ROOT + '" -DOpenCV_DIR="' + $env:OpenCV_DIR + '" -DWITH_WINTAB=Y > "build-fcs-configure.log" 2>&1'
          & cmd.exe /d /s /c $cmd
          $configureExit = $LASTEXITCODE
          if (Test-Path $configureLog) { Get-Content $configureLog -Tail 100 }
          if ($configureExit -ne 0) { throw "CMake configuration failed (exit $configureExit). Full log will be uploaded if the job fails." }
          $projectFile = Join-Path $env:GITHUB_WORKSPACE 'toonz\build\toonzlib\toonzlib.vcxproj'
          if (!(Test-Path $projectFile)) {
            $candidate = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'toonz\build') -Recurse -Filter 'toonzlib.vcxproj' | Select-Object -First 1
            if ($candidate) { $projectFile = $candidate.FullName }
          }
          if (!(Test-Path $projectFile)) { throw 'CMake succeeded but generated toonzlib.vcxproj was not found.' }
          $projectXml = Get-Content $projectFile -Raw
          if ($projectXml -notmatch 'TOONZLIB_EXPORTS') {
            throw 'Generated toonzlib.vcxproj does not define TOONZLIB_EXPORTS. Refusing to compile MOC objects with import decoration.'
          }
          Write-Host "Verified TOONZLIB_EXPORTS in generated project: $projectFile"

      - name: Build native headless engine (capture full compiler log)
        shell: pwsh
        run: |
          $buildLog = Join-Path $env:GITHUB_WORKSPACE 'build-fcs-native.log'
          $cmd = 'cmake --build "toonz\build" --config RelWithDebInfo --target toonz_headless --parallel 2 --verbose > "build-fcs-native.log" 2>&1'
          & cmd.exe /d /s /c $cmd
          $buildExit = $LASTEXITCODE
          if (Test-Path $buildLog) {
            Write-Host '===== Native build log (last 180 lines) ====='
            Get-Content $buildLog -Tail 180
            Write-Host '===== Compiler/linker diagnostics found in build log ====='
            $diag = Select-String -Path $buildLog -Pattern 'error C[0-9]+|fatal error|error LNK[0-9]+|error MSB[0-9]+|FAILED:|CMake Error|undefined reference|unresolved external' | Select-Object -Last 80
            if ($diag) { $diag | ForEach-Object { Write-Host $_.Line } }
            else { Write-Host 'No standard compiler diagnostic pattern matched; inspect the full uploaded log.' }
          }
          if ($buildExit -ne 0) { throw "toonz_headless native build failed (exit $buildExit). Download artifact FCS-native-build-diagnostics for the full compiler log." }
          $exe = 'toonz\build\RelWithDebInfo\toonz_headless.exe'
          if (!(Test-Path $exe)) { throw "Build reported success but executable was not found at $exe" }

      - name: Assemble portable runtime and run staged smoke diagnostics
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'toonz\build\RelWithDebInfo'
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'artifact\FurryCompanion_OpenToonz_Headless_Windows_x64'
          $diag = Join-Path $env:GITHUB_WORKSPACE 'native-smoke-diagnostics'
          New-Item -ItemType Directory -Force $bundle, $diag | Out-Null
          Copy-Item (Join-Path $src 'toonz_headless.exe') $bundle -Force
          Get-ChildItem $src -Filter '*.dll' | ForEach-Object { Copy-Item $_.FullName $bundle -Force }

          $deployLog = Join-Path $env:GITHUB_WORKSPACE 'windeployqt.log'
          & "$env:QT_PATH\bin\windeployqt.exe" --release --compiler-runtime --no-translations (Join-Path $bundle 'toonz_headless.exe') 2>&1 | Tee-Object -FilePath $deployLog
          $deployExit = $LASTEXITCODE
          if ($deployExit -ne 0) { throw "windeployqt failed (exit $deployExit). Inspect windeployqt.log." }

          $extraDlls = @(
            'thirdparty\glut\3.7.6\lib\glut64.dll',
            'thirdparty\glew\glew-1.9.0\bin\64bit\glew32.dll',
            'thirdparty\libmypaint\dist\64\libiconv-2.dll',
            'thirdparty\libmypaint\dist\64\libintl-8.dll',
            'thirdparty\libmypaint\dist\64\libjson-c-2.dll',
            'thirdparty\libmypaint\dist\64\libmypaint-1-4-0.dll',
            'C:\tools\opencv\build\x64\vc16\bin\opencv_world4130.dll'
          )
          foreach ($dll in $extraDlls) {
            if (!(Test-Path $dll)) { throw "Required runtime DLL is missing: $dll" }
            Copy-Item $dll $bundle -Force
          }
          # Resolve transitive Qt runtime dependencies of every packaged PE file.
          # windeployqt follows toonz_headless.exe directly, but does not always
          # copy Qt modules imported only by toonzlib.dll (observed: Qt5Script.dll).
          $programFilesX86Qt = [Environment]::GetFolderPath('ProgramFilesX86')
          $vswhereQt = Join-Path $programFilesX86Qt 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path $vswhereQt)) { throw "vswhere.exe not found: $vswhereQt" }
          $vsPathQt = (& $vswhereQt -latest -version '[17.0,18.0)' -products '*' -property installationPath | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($vsPathQt)) { throw 'Visual Studio 2022 installation was not found for runtime dependency scan.' }
          $vsPathQt = $vsPathQt.Trim()
          $dumpbinQt = Get-ChildItem (Join-Path $vsPathQt 'VC\Tools\MSVC') -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\bin\\Hostx64\\x64\\dumpbin\.exe$' } |
            Select-Object -First 1
          if (!$dumpbinQt) { throw 'dumpbin.exe not found; cannot validate native runtime dependencies.' }

          $qtBinForDeps = Join-Path $env:QT_PATH 'bin'
          $qtDepsLogPath = Join-Path $env:GITHUB_WORKSPACE 'runtime-qt-dependencies.txt'
          $qtDepsLog = [System.Collections.Generic.List[string]]::new()
          $dependencyClosureComplete = $false
          for ($pass = 0; $pass -lt 8; $pass++) {
            $copiedQtThisPass = $false
            $payloadBinaries = @(Get-ChildItem $bundle -Recurse -File | Where-Object { $_.Extension -ieq '.exe' -or $_.Extension -ieq '.dll' })
            foreach ($binary in $payloadBinaries) {
              $dependencyOutput = & $dumpbinQt.FullName /nologo /dependents $binary.FullName 2>&1
              $dumpExit = $LASTEXITCODE
              if ($dumpExit -ne 0) {
                $qtDepsLog.Add("DUMPBIN FAILED ($dumpExit): $($binary.FullName)")
                $qtDepsLog | Set-Content -Path $qtDepsLogPath -Encoding utf8
                throw "Could not inspect dependencies of $($binary.Name); see runtime-qt-dependencies.txt."
              }
              $dependencyText = $dependencyOutput -join "`n"
              $qtMatches = [regex]::Matches($dependencyText, '(?im)^\s*(Qt5[A-Za-z0-9_]+\.dll)\s*$')
              foreach ($match in $qtMatches) {
                $qtDllName = $match.Groups[1].Value
                $bundleDll = Join-Path $bundle $qtDllName
                if (!(Test-Path $bundleDll)) {
                  $sourceQtDll = Join-Path $qtBinForDeps $qtDllName
                  if (!(Test-Path $sourceQtDll)) {
                    $qtDepsLog.Add("MISSING: $qtDllName imported by $($binary.Name); searched $sourceQtDll")
                    $qtDepsLog | Set-Content -Path $qtDepsLogPath -Encoding utf8
                    throw "Required Qt runtime DLL '$qtDllName' (imported by '$($binary.Name)') is missing from the bundle and Qt bin folder."
                  }
                  Copy-Item $sourceQtDll $bundleDll -Force
                  $qtDepsLog.Add("COPIED: $qtDllName (imported by $($binary.Name))")
                  Write-Host "Resolved transitive Qt dependency: $qtDllName"
                  $copiedQtThisPass = $true
                }
              }
            }
            if (!$copiedQtThisPass) {
              $dependencyClosureComplete = $true
              break
            }
          }
          if (!$dependencyClosureComplete) {
            $qtDepsLog.Add('ERROR: Qt dependency closure did not converge within 8 passes.')
            $qtDepsLog | Set-Content -Path $qtDepsLogPath -Encoding utf8
            throw 'Qt runtime dependency resolution did not converge; see runtime-qt-dependencies.txt.'
          }
          if ($qtDepsLog.Count -eq 0) { $qtDepsLog.Add('PASS: no missing Qt5 runtime dependencies detected.') }
          $qtDepsLog | Set-Content -Path $qtDepsLogPath -Encoding utf8

          Copy-Item 'stuff' (Join-Path $bundle 'portablestuff') -Recurse -Force
          $env:TOONZROOT = Join-Path $bundle 'portablestuff'
          $env:QT_DEBUG_PLUGINS = '1'
          $exe = Join-Path $bundle 'toonz_headless.exe'

          # Preserve evidence even if the process dies before writing a JSON-RPC response.
          Get-ChildItem $bundle -Recurse -File | ForEach-Object {
            [PSCustomObject]@{ RelativePath = $_.FullName.Substring($bundle.Length).TrimStart('\'); Bytes = $_.Length }
          } | Export-Csv (Join-Path $env:GITHUB_WORKSPACE 'runtime-file-list.csv') -NoTypeInformation -Encoding utf8
          @"
          Executable: $exe
          TOONZROOT: $env:TOONZROOT
          QT_PATH: $env:QT_PATH
          QT_DEBUG_PLUGINS: $env:QT_DEBUG_PLUGINS
          Runner: $env:RUNNER_OS / $env:RUNNER_ARCH
          "@ | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'runtime-environment.txt') -Encoding utf8

          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $vswhere = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -version '[17.0,18.0)' -products '*' -property installationPath
            $dumpbin = Get-ChildItem (Join-Path $vsPath 'VC\Tools\MSVC') -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\bin\\Hostx64\\x64\\dumpbin\.exe$' } | Select-Object -First 1
            if ($dumpbin) {
              & $dumpbin.FullName /nologo /dependents $exe 2>&1 | Out-File (Join-Path $env:GITHUB_WORKSPACE 'runtime-pe-dependencies.txt') -Encoding utf8
              $toonzlib = Join-Path $bundle 'toonzlib.dll'
              if (Test-Path $toonzlib) { & $dumpbin.FullName /nologo /dependents $toonzlib 2>&1 | Out-File (Join-Path $env:GITHUB_WORKSPACE 'runtime-pe-dependencies.txt') -Append -Encoding utf8 }
            }
          }

          @'
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import traceback

          exe = pathlib.Path(sys.argv[1]).resolve()
          root = pathlib.Path.cwd()
          outdir = root / "native-smoke-diagnostics"
          outdir.mkdir(parents=True, exist_ok=True)
          os.environ["QT_DEBUG_PLUGINS"] = "1"
          stages = [
              ("01_ping", [{"jsonrpc":"2.0","id":1,"method":"ping","params":{}},
                            {"jsonrpc":"2.0","id":99,"method":"quit","params":{}}], "pong"),
              ("02_bindings_globals", [{"jsonrpc":"2.0","id":1,"method":"eval","params":{"code":"print(typeof Scene); print(typeof PlasticRig);"}},
                                        {"jsonrpc":"2.0","id":99,"method":"quit","params":{}}], "function"),
              ("03_scene_fcs_api", [{"jsonrpc":"2.0","id":1,"method":"eval","params":{"code":"var s = new Scene(); print(typeof s.buildMeshAdvanced); print(typeof s.getMeshInfo); print(typeof s.getMeshVertices); print(typeof s.setMeshRigidityAtPoint);"}},
                                    {"jsonrpc":"2.0","id":99,"method":"quit","params":{}}], "function"),
              ("04_rig_fcs_api", [{"jsonrpc":"2.0","id":1,"method":"eval","params":{"code":"var r = new PlasticRig(); print(typeof r.setVertexAngleLimits);"}},
                                  {"jsonrpc":"2.0","id":99,"method":"quit","params":{}}], "function"),
          ]
          all_ok = True
          summaries = []

          def parse_json_lines(stdout):
              parsed = []
              for line in stdout.splitlines():
                  line = line.strip()
                  if not line.startswith("{"):
                      continue
                  try:
                      parsed.append(json.loads(line))
                  except Exception:
                      pass
              return parsed

          for name, requests, expected in stages:
              payload = "\n".join(json.dumps(x, separators=(",", ":")) for x in requests) + "\n"
              stage_path = outdir / f"{name}.txt"
              try:
                  p = subprocess.run([str(exe)], input=payload, text=True, capture_output=True,
                                     timeout=90, env=os.environ.copy(), cwd=str(exe.parent))
                  hexcode = f"0x{(p.returncode & 0xffffffff):08X}"
                  parsed = parse_json_lines(p.stdout)
                  response_text = "\n".join(str(x.get("result", {}).get("output", "")) for x in parsed if x.get("id") == 1)
                  if name == "01_ping":
                      matched = any(x.get("id") == 1 and x.get("result") == "pong" for x in parsed)
                  else:
                      matched = expected in response_text
                  stage_ok = (p.returncode == 0 and matched)
                  report = (
                      f"STAGE={name}\nEXECUTABLE={exe}\nRETURN_CODE_DECIMAL={p.returncode}\nRETURN_CODE_HEX={hexcode}\n"
                      f"EXPECTED={expected}\nMATCHED={matched}\nPASS={stage_ok}\n\n"
                      f"--- STDOUT ---\n{p.stdout}\n--- STDERR ---\n{p.stderr}\n"
                      f"--- PARSED JSON ---\n{json.dumps(parsed, indent=2, ensure_ascii=False)}\n"
                  )
                  stage_path.write_text(report, encoding="utf-8")
                  print(f"===== {name}: return={p.returncode} ({hexcode}), matched={matched} =====")
                  print("--- stdout ---")
                  print(p.stdout[-12000:] if p.stdout else "<empty>")
                  print("--- stderr ---")
                  print(p.stderr[-12000:] if p.stderr else "<empty>")
                  summaries.append({"stage":name,"return_code":p.returncode,"return_code_hex":hexcode,"matched":matched,"passed":stage_ok})
                  all_ok = all_ok and stage_ok
              except Exception as exc:
                  report = f"STAGE={name}\nEXCEPTION={type(exc).__name__}: {exc}\n{traceback.format_exc()}"
                  stage_path.write_text(report, encoding="utf-8")
                  print(report)
                  summaries.append({"stage":name,"exception":f"{type(exc).__name__}: {exc}","passed":False})
                  all_ok = False

          (outdir / "summary.json").write_text(json.dumps(summaries, indent=2), encoding="utf-8")
          print("===== SMOKE SUMMARY =====")
          print(json.dumps(summaries, indent=2))
          if not all_ok:
              raise SystemExit(1)
          print("FCS native smoke test PASSED")
          '@ | Set-Content -Path 'smoke_test.py' -Encoding utf8
          python smoke_test.py $exe
          $smokeExit = $LASTEXITCODE
          if ($smokeExit -ne 0) { throw "Native smoke test failed (exit $smokeExit). Download FCS-native-build-diagnostics and inspect native-smoke-diagnostics\01_ping.txt first." }

          $manifest = [ordered]@{
            name = 'Furry Companion OpenToonz Headless';
            version = 'FCS-API-v0.7.2-runtime-fix';
            source_commit = $env:GITHUB_SHA;
            build_configuration = 'RelWithDebInfo';
            architecture = 'x64';
            qt = '5.15.2_wintab';
            smoke_test = 'passed';
            built_utc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $manifest | ConvertTo-Json | Set-Content (Join-Path $bundle 'BUILD_MANIFEST.json') -Encoding utf8
          Get-FileHash (Join-Path $bundle 'toonz_headless.exe') -Algorithm SHA256 | Format-List | Out-String | Set-Content (Join-Path $bundle 'SHA256_EXE.txt')

      - name: Upload verified native engine artifact
        uses: actions/upload-artifact@v6
        with:
          name: FurryCompanion-OpenToonz-Headless-Windows-x64
          path: artifact/FurryCompanion_OpenToonz_Headless_Windows_x64/
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: FCS-native-build-diagnostics
          path: |
            build-fcs-configure.log
            build-fcs-native.log
            windeployqt.log
            runtime-environment.txt
            runtime-file-list.csv
            runtime-pe-dependencies.txt
            runtime-qt-dependencies.txt
            smoke_test.py
            native-smoke-diagnostics/**
            toonz/build/CMakeCache.txt
            toonz/build/toonzlib/toonzlib.vcxproj
            toonz/build/toonzlib/moc_scriptbinding_effect.cpp
            toonz/build/toonzlib/moc_scriptbinding_scene.cpp
            toonz/build/toonzlib/moc_scriptbinding_level.cpp
            toonz/build/toonzlib/moc_scriptbinding_plasticrig.cpp
            toonz/sources/include/toonz/scriptbinding.h
            toonz/sources/include/toonz/scriptbinding_effect.h
            toonz/sources/toonzlib/CMakeLists.txt
            fcs-build-source.txt
          if-no-files-found: ignore
          retention-days: 7 
